<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | StudySync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<header class="header">
  <a class="logo" href="index.html">🎓 StudySync</a>
  <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">☰</button>
  <nav class="nav" id="nav">
    <a href="index.html" data-p="home">Home</a>
    <a href="index.html#about">About</a>
    <a href="dashboard.html#courses">Courses</a>
    <a href="login.html" data-p="login" data-auth="out">Login</a>
    <a href="register.html" data-p="register" data-auth="out">Register</a>
    <a href="dashboard.html" data-p="dashboard" data-auth="in">Dashboard</a>
    <a id="logoutBtn" data-auth="in">Logout</a>
  </nav>
</header>

<main class="auth">
  <div class="welcome script">Welcome<br>Back!<small>🐱📚</small></div>

  <form class="card" id="loginForm" novalidate>
    <h2>Login</h2>
    <p class="sub">Enter your details to continue</p>
    <div id="formMsg"></div>

    <div class="field">
      <label for="identifier">Email or Username</label>
      <input id="identifier" name="identifier" data-rule="required" placeholder="mithra@example.com">
      <small class="msg"></small>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" data-rule="password" placeholder="Password">
      <small class="msg"></small>
    </div>

    <div class="row">
      <label><input type="checkbox" name="remember"> Remember me</label>
      <a href="#">Forgot password?</a>
    </div>
    <button class="btn block" type="submit">Login</button>
    <p class="switch">Don't have an account? <a href="register.html">Register</a></p>
    <p class="switch">Demo: mithra@example.com / 123456</p>
  </form>
</main>

<footer class="footer">
  <span>🎓 StudySync</span>
  <span>© 2026 StudySync. All rights reserved.</span>
  <nav><a href="index.html">Home</a><a href="index.html#about">About</a><a href="dashboard.html#courses">Courses</a></nav>
</footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
